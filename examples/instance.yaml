version: 1

instance:
  hostname: blog
  fqdn: blog.example.org

network:
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: static
        address: 2001:db8:1::10/64
        gateway: fe80::1
  nameservers:
    - 2001:db8:1::53
    - 2001:db8:1::54

tls:
  acme:
    enabled: true
    challenge: http-01
    domains:
      - blog.example.org

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  db_password:
    generate: true

app:
  email: admin@example.org
  domain: blog.example.org
  options:
    ip_bind: "[2001:db8:1::10]"

security:
  alerts: admin@example.org
  updates_at_first_boot: force

hub:
  api_key: skip

first_login_wizard: false

preseed:
  AUTOGROW: ONCE

# Two subjects, never one field (docs/spec.md): this machine runs a MariaDB
# server and the blog on it uses that server. Addresses are literal, because
# on Debian localhost is an IPv4 only name.
database:
  server:
    engine: mariadb
    role: standalone
    listen:
      - "::1"
      - 127.0.0.1
  client:
    engine: mariadb
    primary:
      host: "::1"
      port: 3306
      name: blog
      user: blog
      secret:
        file: /etc/keel/secrets/db_password
