[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.8.1"
authors = [{name = "KeelLinux maintainers"}]
description = "Declarative management of one appliance instance"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["PyYAML"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Homepage = "https://github.com/marcos-mendez/keel"

[tool.setuptools]
packages = ["keel", "keel.spec", "keel.layers", "keel.inspect", "keel.diff",
            "keel.system"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["keel"]

[tool.coverage.report]
fail_under = 95
show_missing = true
