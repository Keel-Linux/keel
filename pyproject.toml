[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
authors = [{name = "KeelLinux maintainers"}]
description = "Declarative management of one appliance instance"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["PyYAML"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Homepage = "https://github.com/marcos-mendez/keel"

[tool.setuptools]
packages = ["keel", "keel.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
