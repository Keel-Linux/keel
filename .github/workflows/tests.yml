# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop, and
# .forgejo/workflows/tests.yml has the notes on each job.
#
# Jobs on Forgejo only (no GitHub-hosted version): etcd, etcd-auth, mariadb, mariadb-simple, mesh, postgres, vip, vip-upgrade.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: keel-linux/.github/.github/workflows/github-test-python.yml@main
    with:
      threshold: 95
      package: keel
      apt-packages: bats shellcheck gnupg gpgv wireguard-tools

  package:
    uses: keel-linux/.github/.github/workflows/github-require-changelog.yml@main
