# keel's firewall survives nftables.service (handbook decision 0097).
#
# Debian's /etc/nftables.conf starts with `flush ruleset`, and the unit's
# stop runs `nft flush ruleset`: each start, reload, restart and stop of
# nftables.service removes keel's table `inet keel`, and the node is open
# (the real test of keel pull request 307: open for the whole 540 s
# probe after `systemctl restart nftables.service`). So keel's file is
# loaded again right after each of them, in the same unit run: the open
# window is the time between the two nft runs, milliseconds. The file
# replaces keel's own table only, in one transaction. With no file of
# keel's (an apply never ran, or `firewall.state: off`) nothing runs. A
# file nft refuses is not loaded and does not fail nftables.service (the
# `-`): keel-firewall-watch.timer reports it.
#
# After each load, firewall-ssh-guard opens IPv4 22 again where the
# file closes it and the node lost its global IPv6 (decision 0098).
#
# No restart: a drop-in changes nothing until nftables.service runs.
[Service]
ExecStartPost=-/bin/sh -c '[ ! -e /etc/keel/firewall/keel-manifest.nft ] || { /usr/sbin/nft -f /etc/keel/firewall/keel-manifest.nft && /usr/lib/keel/firewall-ssh-guard; }'
ExecReload=-/bin/sh -c '[ ! -e /etc/keel/firewall/keel-manifest.nft ] || { /usr/sbin/nft -f /etc/keel/firewall/keel-manifest.nft && /usr/lib/keel/firewall-ssh-guard; }'
ExecStopPost=-/bin/sh -c '[ ! -e /etc/keel/firewall/keel-manifest.nft ] || { /usr/sbin/nft -f /etc/keel/firewall/keel-manifest.nft && /usr/lib/keel/firewall-ssh-guard; }'
