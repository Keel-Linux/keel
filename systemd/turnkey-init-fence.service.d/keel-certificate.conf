# keel: the certificate of tls.acme when the init fence stops for good
# (keel#320). While inithooks' init fence is up, ports 80 and 443 answer
# its page to the outside, so the http-01 request is deferred. After each
# stop of the fence, /usr/lib/keel/certificate-after-fence starts
# keel-certificate.service when the fence is disabled (keel-init is
# finished) and the first boot's run is over; else it does nothing. The
# `-`: the stop of the fence never fails because of it.
#
# No restart: a drop-in changes nothing until the fence stops.
[Service]
ExecStopPost=-/usr/lib/keel/certificate-after-fence
