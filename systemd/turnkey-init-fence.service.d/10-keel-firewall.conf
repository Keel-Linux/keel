# keel: the ruleset agrees with the node after the init fence (keel#322).
# While inithooks' init fence is enabled, keel's ruleset accepts its
# ports for redirected packets only (decision 0097, section 2, item 4),
# and the first boot's apply writes and loads that rule. After each stop
# of the fence, `keel firewall refresh` writes the ruleset again by the
# apply's firewall step, unattended, and loads it, when the fence is no
# longer enabled (97turnkey-init-fence-disable disables it, then stops
# it). A shutdown or a stop by hand leaves the fence enabled, and nothing
# changes. It runs before the stop ends, so `keel diff` after the first
# boot sees the new file. The `-`: the stop of the fence never fails
# because of it.
#
# Its own file: other drop-ins of keel in this directory add their own
# ExecStopPost lines. systemd runs them in the order of the file names, so
# the name starts with 10: the refresh ends before keel-certificate.conf
# (keel#320) starts keel-certificate.service, whose apply holds the
# firewall lock while it asks the certificate authority.
#
# After each start of the fence (`--started`), the refresh writes the
# ruleset again too, so a ruleset that lost the fence rule after a failed
# start (inithooks#68, keel#338) opens the fence ports again. systemd
# runs ExecStartPost after the fence's ExecStart has loaded its own table
# (inet keel_fence); the refresh replaces only inet keel, under keel's
# firewall lock. On a new node it does nothing: there is no firewall of
# keel's yet. A failed start runs no ExecStartPost.
#
# No restart: a drop-in changes nothing until the fence starts or stops.
[Service]
ExecStartPost=-/usr/bin/keel firewall refresh --started
ExecStopPost=-/usr/bin/keel firewall refresh
