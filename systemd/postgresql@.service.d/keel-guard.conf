# keel database guard (keel#156): on a VIP pair, the PostgreSQL server
# starts as a primary only on the node whose claim of the VIP is proven
# (the VIP on wg0). On the other member it starts as a standby that
# follows nobody. On a holder whose claim is not proven yet (at boot) the
# start is refused, and keel database follow starts the server once the
# VIP is proven. On a node with no pair it does nothing. The + runs it
# as root: the unit runs as postgres, and the guard reads keel's state.
[Service]
ExecStartPre=+/usr/bin/keel database guard
