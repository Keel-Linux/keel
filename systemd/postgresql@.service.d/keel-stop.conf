# keel#219: a stop that arrives while the start still runs does not run
# ExecStop (a fast shutdown, Debian's), and systemd sends SIGTERM to the
# postmaster. SIGTERM is a smart shutdown: the postmaster waits for every
# client to leave, and an idle client (the poll of Odoo's serve.py, a psql of
# keel) holds the stop for TimeoutStopSec, which Debian sets to 1 h. Measured
# on a real standby with one idle client: SIGTERM, the postmaster alive after
# 12 s; SIGINT, gone in under 5 s.
#
# KillSignal=SIGINT is a fast shutdown: committed data is safe. After 120 s
# the final SIGKILL is crash safe too, because PostgreSQL recovers from its
# WAL at the next start.
[Service]
KillSignal=SIGINT
TimeoutStopSec=120s
